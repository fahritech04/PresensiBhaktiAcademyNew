<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Riwayat Presensi &middot; Bhakti Sebatung Academy</title>
    <script src="/assets/js/core/head.js?v=b90a6cf9"></script>
    <link rel="stylesheet" href="/assets/css/style.css?v=a73bb805" />
    <style>
      .filter-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: auto;
        align-self: flex-end;
      }
      .seg-toggle {
        display: flex;
        gap: 8px;
      }
      @media screen and (max-width: 479px) {
        .filter-actions {
          width: 100%;
          margin-left: 0;
        }
        .filter-actions .seg-toggle {
          flex: 1;
        }
        .filter-actions .seg-toggle .btn {
          flex: 1;
          min-width: 0;
          padding: 8px 6px;
        }
        .filter-actions #btnFilter {
          flex: 1;
          min-width: 0;
          padding: 8px 6px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div id="topbar-root"></div>

      <main class="view" id="mainContent" tabindex="-1">
        <div class="view-head" id="viewHead"></div>

        <div class="card data-card">
          <div class="card-body">
            <div class="toolbar filter-toolbar">
              <div class="field mb-0">
                <label for="filterDari">Dari Tanggal</label>
                <input type="date" class="input" id="filterDari" />
              </div>
              <div class="field mb-0">
                <label for="filterSampai">Sampai Tanggal</label>
                <input type="date" class="input" id="filterSampai" />
              </div>
              <div class="field mb-0" style="display: none">
                <label for="filterKelompok">Kelompok</label>
                <select class="input" id="filterKelompok">
                  <option value="">Semua</option>
                </select>
              </div>
              <div class="field mb-0">
                <label for="filterStatus">Status</label>
                <select class="input" id="filterStatus">
                  <option value="">Semua</option>
                  <option value="Hadir">Hadir</option>
                  <option value="Telat">Telat</option>
                </select>
              </div>
              <div class="filter-actions">
                <div class="seg-toggle" role="group" aria-label="Mode tampilan">
                  <button type="button" class="btn btn-primary btn-sm" id="btnDetail">Detail</button>
                  <button type="button" class="btn btn-ghost btn-sm" id="btnRekap">Rekap</button>
                </div>
                <button type="button" class="btn btn-primary btn-sm" id="btnFilter">Terapkan</button>
              </div>
            </div>
          </div>
          <div class="card-body pad-0">
            <p class="table-hint no-print">Geser tabel untuk melihat kolom lainnya.</p>
            <div class="table-wrap" id="detailWrap" tabindex="0" role="region" aria-label="Tabel riwayat presensi">
              <table class="tbl">
                <thead>
                  <tr>
                    <th scope="col">Tanggal</th>
                    <th scope="col">Nama Siswa</th>
                    <th scope="col" style="display: none">Kelompok</th>
                    <th scope="col">Jam</th>
                    <th scope="col">Status</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div id="emptyState" class="empty-state hidden">
              <h3>Tidak ada data</h3>
              <p>Coba ubah rentang tanggal atau filter lainnya.</p>
            </div>
            <div class="table-wrap" id="rekapWrap" style="display:none" tabindex="0" role="region" aria-label="Rekap kehadiran siswa">
              <table class="tbl">
                <thead>
                  <tr>
                    <th scope="col">Nama Siswa</th>
                    <th scope="col">Hadir</th>
                    <th scope="col">Telat</th>
                    <th scope="col">Total</th>
                  </tr>
                </thead>
                <tbody id="rekapBody"></tbody>
              </table>
            </div>
            <div id="rekapEmpty" class="empty-state hidden">
              <h3>Tidak ada data</h3>
              <p>Coba ubah rentang tanggal atau filter lainnya.</p>
            </div>
            <div class="pagination no-print" id="paginationBar">
              <div class="pagination-size" id="sizeGroup">
                <label for="pageSizeSelect">Tampilkan</label>
                <select class="input" id="pageSizeSelect" aria-label="Jumlah riwayat per halaman">
                  <option value="50" selected>50</option>
                  <option value="100">100</option>
                  <option value="500">500</option>
                  <option value="1000">1000</option>
                </select>
                <span>data per halaman</span>
              </div>
              <span id="rowInfo">0 data</span>
              <div class="pagination-nav" id="navGroup">
                <button type="button" class="btn btn-ghost btn-sm" id="btnFirst" aria-label="Ke halaman pertama">&laquo;&nbsp;Awal</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnPrev">&larr;&nbsp;Sebelumnya</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnNext">Berikutnya&nbsp;&rarr;</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnLast" aria-label="Ke halaman terakhir">Akhir&nbsp;&raquo;</button>
              </div>
              <button type="button" class="btn btn-ghost btn-sm" id="btnExport">&darr; Unduh Laporan</button>
            </div>
          </div>
        </div>
      </main>

      <div id="nav-root"></div>
    </div>

    <script src="/assets/js/core/config.js?v=83428062" defer></script>
    <script src="/assets/js/core/api.js?v=3dbe117c" defer></script>
    <script src="/assets/js/core/auth.js?v=98d1b5ed" defer></script>
    <script src="/assets/js/core/ui.js?v=ce680aa1" defer></script>
    <script src="/assets/js/core/pager.js?v=cdd83ba1" defer></script>
    <script src="/assets/js/pages/presensi.js?v=7060a703" defer></script>
  </body>
</html>
