<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Data Pelatih &middot; Bhakti Sebatung Academy</title>
    <script src="/assets/js/core/head.js?v=b90a6cf9"></script>
    <link rel="stylesheet" href="/assets/css/style.css?v=97a7c7c0" />
  </head>
  <body>
    <div class="shell">
      <div id="topbar-root"></div>

      <main class="view" id="mainContent" tabindex="-1">
        <div class="view-head" id="viewHead"></div>

        <div class="card data-card">
          <div class="card-body">
            <div class="toolbar filter-toolbar">
              <div class="search-input">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <circle cx="11" cy="11" r="8" />
                  <line x1="21" y1="21" x2="16.65" y2="16.65" />
                </svg>
                <input type="text" class="input" id="searchInput" aria-label="Cari pelatih berdasarkan nama atau kode QR" placeholder="Cari nama atau kode QR..." />
              </div>
              <select class="input" id="filterStatus" aria-label="Filter status pelatih" style="max-width: 160px">
                <option value="">Semua Status</option>
                <option value="Aktif">Aktif</option>
                <option value="Nonaktif">Nonaktif</option>
              </select>
            </div>
          </div>
          <div class="card-body pad-0">
            <p class="table-hint no-print">Geser tabel untuk melihat kolom lainnya.</p>
            <div class="table-wrap" tabindex="0" role="region" aria-label="Tabel data pelatih">
              <table class="tbl">
                <thead>
                  <tr>
                    <th scope="col">Kode QR</th>
                    <th scope="col">Nama Pelatih</th>
                    <th scope="col">Status</th>
                    <th scope="col">Verifikasi</th>
                    <th scope="col">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tableBody"></tbody>
              </table>
            </div>
            <div id="emptyState" class="empty-state hidden">
              <h3 id="emptyTitle">Belum ada data pelatih</h3>
              <p id="emptyDesc">Klik "Tambah Pelatih" untuk mendaftarkan pelatih baru.</p>
            </div>

            <div class="pagination no-print" id="paginationBar">
              <div class="pagination-size">
                <label for="pageSizeSelect">Tampilkan</label>
                <select class="input" id="pageSizeSelect" aria-label="Jumlah data pelatih per halaman">
                  <option value="25">25</option>
                  <option value="50">50</option>
                  <option value="100">100</option>
                </select>
                <span>data per halaman</span>
              </div>
              <span id="rowInfo">0 data</span>
              <div class="pagination-nav">
                <button type="button" class="btn btn-ghost btn-sm" id="btnFirst" aria-label="Ke halaman pertama">&laquo;&nbsp;Awal</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnPrev">&larr;&nbsp;Sebelumnya</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnNext">Berikutnya&nbsp;&rarr;</button>
                <button type="button" class="btn btn-ghost btn-sm" id="btnLast" aria-label="Ke halaman terakhir">Akhir&nbsp;&raquo;</button>
              </div>
            </div>
          </div>
        </div>
      </main>

      <div id="nav-root"></div>
    </div>

    <!-- Modal Tambah/Edit Pelatih -->
    <div class="modal-backdrop" id="pelatihModal">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-head">
          <div>
            <h3 id="modalTitle">Tambah Pelatih</h3>
            <p class="desc">Kode QR dibuat otomatis oleh sistem</p>
          </div>
          <button type="button" class="modal-close" id="btnCloseModal" aria-label="Tutup formulir pelatih">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <line x1="18" y1="6" x2="6" y2="18" />
              <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
          </button>
        </div>
        <form id="pelatihForm">
          <div class="modal-body">
            <input type="hidden" id="fBarcode" />
            <div class="form-grid">
              <div class="field full">
                <label for="fNama">Nama Pelatih *</label>
                <input class="input" id="fNama" required placeholder="cth. Coach Budi" />
              </div>
              <div class="field full">
                <label for="fStatus">Status</label>
                <select class="input" id="fStatus">
                  <option value="Aktif">Aktif</option>
                  <option value="Nonaktif">Nonaktif</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="btnBatal">Batal</button>
            <button type="submit" class="btn btn-primary" id="btnSimpan">Simpan Pelatih</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/assets/js/core/config.js?v=83428062" defer></script>
    <script src="/assets/js/core/api.js?v=3dbe117c" defer></script>
    <script src="/assets/js/core/auth.js?v=e77de707" defer></script>
    <script src="/assets/js/core/ui.js?v=ce680aa1" defer></script>
    <script src="/assets/js/core/pager.js?v=cdd83ba1" defer></script>
    <script src="/assets/js/pages/pelatih.js?v=89a3c493" defer></script>
  </body>
</html>
